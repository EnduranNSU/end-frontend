name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install frontend deps
        run: npm ci --legacy-peer-deps

      - name: Install Capacitor deps
        working-directory: src-capacitor
        run: npm ci --legacy-peer-deps

      - name: Build Quasar + sync to Android
        run: npx quasar build -m capacitor -T android

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > src-capacitor/android/local.properties

      - name: Build debug APK
        working-directory: src-capacitor/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          files: src-capacitor/android/app/build/outputs/apk/debug/app-debug.apk
